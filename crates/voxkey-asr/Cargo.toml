[package]
name = "voxkey-asr"
version = "0.2.2"
edition = "2024"
rust-version = "1.95"
description = "SenseVoice engine worker for VoxKey"
license = "MIT"
repository = "https://github.com/katriyda/VoxKey"

[[bin]]
name = "VoxKey-asr"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sherpa-onnx = "2.0.1"
