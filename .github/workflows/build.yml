name: Build VoxKey

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify tag matches Cargo.toml version
        # The in-app updater compares the release tag against the version
        # compiled into the binary (`CARGO_PKG_VERSION`). A mismatch makes
        # every build report itself as older than its own release.
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $match = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          if (-not $match) { throw "Cannot read package version from Cargo.toml" }
          $version = $match.Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match Cargo.toml version $version"
          }

      - name: Install Rust
        # Pinned to the toolchain in mise.toml so CI and local builds agree.
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Test
        run: cargo test --release --locked

      - name: Build release executable
        run: cargo build --release --locked

      - name: Verify standalone executable
        shell: pwsh
        run: |
          $dumpbin = Get-ChildItem "$env:ProgramFiles\Microsoft Visual Studio\2022\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dumpbin) {
            throw "dumpbin.exe not found"
          }
          $out = & $dumpbin.FullName /dependents "target\release\VoxKey.exe"
          $out | Write-Output
          if ($out -match "onnxruntime|sherpa|VCRUNTIME|MSVCP") {
            throw "VoxKey.exe still depends on a non-system runtime DLL"
          }

      - name: Smoke test version flag
        # The in-app updater validates a downloaded build by running it with
        # `--version` and reading stdout, so this reproduces that exact path.
        shell: pwsh
        run: |
          $match = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          $version = $match.Matches[0].Groups[1].Value
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = (Resolve-Path "target\release\VoxKey.exe").Path
          $psi.Arguments = "--version"
          $psi.RedirectStandardOutput = $true
          $psi.UseShellExecute = $false
          $process = [System.Diagnostics.Process]::Start($psi)
          $stdout = $process.StandardOutput.ReadToEnd()
          $process.WaitForExit()
          Write-Output "stdout: $stdout"
          if ($process.ExitCode -ne 0) {
            throw "VoxKey.exe --version exited with $($process.ExitCode)"
          }
          if ($stdout.Trim() -ne "VoxKey $version") {
            throw "VoxKey.exe --version printed '$($stdout.Trim())', expected 'VoxKey $version'"
          }

      - name: Verify embedded version resource
        # build.rs compiles the icon, VERSIONINFO and UAC manifest with rc.exe.
        # If the resource compiler is ever missing the block would silently
        # disappear, leaving an anonymous binary that SmartScreen and antivirus
        # ML classifiers distrust. Assert the metadata is really in the PE.
        shell: pwsh
        run: |
          $match = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          $version = $match.Matches[0].Groups[1].Value
          $info = (Get-Item "target\release\VoxKey.exe").VersionInfo
          Write-Output "CompanyName=$($info.CompanyName) FileDescription=$($info.FileDescription) ProductVersion=$($info.ProductVersion)"
          if ($info.CompanyName -ne "VoxKey") {
            throw "VERSIONINFO resource missing: CompanyName='$($info.CompanyName)'"
          }
          if ($info.ProductVersion -ne $version) {
            throw "VERSIONINFO ProductVersion '$($info.ProductVersion)' does not match Cargo.toml '$version'"
          }

      - name: Upload single-file artifact
        uses: actions/upload-artifact@v7
        with:
          name: VoxKey-windows-x64
          path: target/release/VoxKey.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "target/release/VoxKey.exe" --clobber
          } else {
            gh release create $tag "target/release/VoxKey.exe" --title "VoxKey $tag" --generate-notes
          }
