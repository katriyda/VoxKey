name: Build VoxKey

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Test
        run: cargo test --release

      - name: Build release executable
        run: cargo build --release

      - name: Verify standalone executable
        shell: pwsh
        run: |
          $dumpbin = Get-ChildItem "$env:ProgramFiles\Microsoft Visual Studio\2022\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dumpbin) {
            throw "dumpbin.exe not found"
          }
          $out = & $dumpbin.FullName /dependents "target\release\VoxKey.exe"
          $out | Write-Output
          if ($out -match "onnxruntime|sherpa|VCRUNTIME|MSVCP") {
            throw "VoxKey.exe still depends on a non-system runtime DLL"
          }

      - name: Smoke test version flag
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "target\release\VoxKey.exe" -ArgumentList "--version" -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) {
            throw "VoxKey.exe --version exited with $($process.ExitCode)"
          }

      - name: Upload single-file artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoxKey-windows-x64
          path: target/release/VoxKey.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "target/release/VoxKey.exe" --clobber
          } else {
            gh release create $tag "target/release/VoxKey.exe" --title "VoxKey $tag" --generate-notes
          }
